name: london+ny uganda 10am-11pm
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 7-20 * * 1-5'
jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install yfinance pandas
      - run: python signal_scanner.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add Bot/ open_signals.json closed_trades.csv -A || true
          git commit -m "trade $(date -u)" || true
          git push || true
