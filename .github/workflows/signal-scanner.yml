name: Forex Scalp Signal Scanner
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install yfinance pandas numpy
      - name: Run
        run: python Bot/signal_scanner.py
      - name: Save logs
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add Bot/ || true
          git add *.json *.csv || true
          git diff --staged --quiet || git commit -m "update signals"
          git push || true
