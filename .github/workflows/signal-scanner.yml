name: Rapid Scan
on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas
      - run: python signal_scanner.py
      - name: Commit
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git add open_signals.json closed_trades.csv signals_log.csv Bot/ || true
          git diff --staged --quiet || git commit -m "rapid"
          git push
