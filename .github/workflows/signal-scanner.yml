name: london uganda time
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 7-16 * * 1-5' # 7-16 UTC = 10am-7pm Uganda, Mon-Fri only
jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install yfinance pandas
      - run: python signal_scanner.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add Bot/open_signals.json Bot/closed_trades.csv open_signals.json closed_trades.csv || true
          git commit -m "london $(date -u)" || true
          git push || true
