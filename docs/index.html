<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAPID $10 LIVE</title>
<style>body{background:#050a10;color:#cfe8ff;font-family:monospace;padding:10px;margin:0}.h{color:#fff;font-size:18px;padding:12px;background:#0e1a28;border-radius:10px;display:flex;justify-content:space-between;align-items:center}.card{background:#101a26;border:1px solid #1e344d;border-radius:12px;padding:12px;margin:8px 0}.BUY{color:#00ff88;background:#00ff8822;padding:2px 8px;border-radius:6px}.SELL{color:#ff4d4d;background:#ff4d4d22;padding:2px 8px;border-radius:6px}.b{font-size:20px;font-weight:700}.s{font-size:11px;color:#6a8aaa}.live{color:#00ff88;animation:bl 1s infinite}@keyframes bl{50%{opacity:.3}}.pos{color:#00ff88}.neg{color:#ff4d4d}</style>
</head><body>
<div class="h"><span>⚡ RAPID CENTS SCALPER <span class="live">● LIVE</span></span><span id="tm" class="s"></span></div>
<div id="open"></div>
<div class="card" id="stats" style="border-left:4px solid #00ff88"></div>
<div class="h" style="font-size:14px;margin-top:12px">Closed - Cents Profit</div>
<div id="closed"></div>
<script>
async function tryFetch(paths){
 for(let p of paths){
  try{let r=await fetch(p+'?v='+Date.now());let t=await r.text();if(t.trim().startsWith('<')||t.includes('<!DOCTYPE'))continue;return {path:p,text:t,json:JSON.parse(t)};}catch(e){try{let r=await fetch(p+'?v='+Date.now());let t=await r.text();if(!t.startsWith('<'))return {path:p,text:t};}catch{}}
 }
 return null;
}
async function tryFetchCSV(paths){
 for(let p of paths){try{let r=await fetch(p+'?v='+Date.now());let t=await r.text();if(t.startsWith('<')||t.includes('<!DOCTYPE'))continue;if(t.includes('symbol'))return t;}catch(e){}}
 return null;
}
async function load(){
 document.getElementById('tm').innerText=new Date().toLocaleTimeString();
 let openPaths=['open_signals.json','Bot/open_signals.json','./open_signals.json','/Bot/open_signals.json','/Bot/Bot/open_signals.json','Bot/Bot/open_signals.json'];
 let closedPaths=['closed_trades.csv','Bot/closed_trades.csv','./closed_trades.csv','/Bot/closed_trades.csv','/Bot/Bot/closed_trades.csv','Bot/Bot/closed_trades.csv'];
 let data=await tryFetch(openPaths);
 let total$=0,count=0;
 if(data && data.json){
  let j=data.json;let h='';
  for(let s in j){for(let t of j[s]||[]){if(!t.entry_price)continue;let cur=t.current_price,e=t.entry_price;let pip=s=='XAUUSD'?0.1:s=='USDJPY'?0.01:0.0001;let pips=t.direction=='BUY'?(cur-e)/pip:(e-cur)/pip;let usd=pips*0.01;total$+=usd;count++;h+=`<div class="card"><b>${s}</b> <span class="${t.direction}">${t.direction}</span> <span class="b" style="color:${pips>=0?'#00ff88':'#ff4d4d'}">${pips>=0?'+':''}${pips.toFixed(2)}p $${usd.toFixed(4)}</span><br><span class="s">E ${e.toFixed(5)} → ${cur.toFixed(5)}</span></div>`;}}
  document.getElementById('open').innerHTML=h||'<div class="card s">No open - opening next candle (60s)</div>';
 }else{document.getElementById('open').innerHTML='<div class="card s">Waiting first scan... creating file</div>';}
 document.getElementById('stats').innerHTML=`<div>Open: ${count} | Live P/L: <b style="color:${total$>=0?'#00ff88':'#ff4d4d'}">$${total$.toFixed(4)}</b></div><div class="s">Mode: GREEN=BUY RED=SELL | Close at 0.15p = $0.0015 cents instantly | ${data?data.path:'no file yet'}</div>`;
 let csvText=await tryFetchCSV(closedPaths);
 if(csvText){let rows=csvText.trim().split('\n').slice(-20).reverse();let h='';for(let r of rows){if(r.includes('symbol')||!r.includes(','))continue;let c=r.split(',');if(c.length<6)continue;let win=c[5]=='WIN';h+=`<div class="card"><b>${c[1]}</b> ${c[2]} <span style="color:${win?'#00ff88':'#ff4d4d'}">${c[5]} ${c[6]}p</span> <span class="s">${c[0]?c[0].slice(11,16):''}</span></div>`;}document.getElementById('closed').innerHTML=h||'<div class="card s">No closed yet</div>';}else{document.getElementById('closed').innerHTML='<div class="card s">No closed file yet</div>';}
}
load();setInterval(load,3000);
</script></body></html>
