<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAPID $10</title><style>body{background:#050a10;color:#cfe8ff;font-family:monospace;padding:10px}.h{color:#fff;font-size:18px;margin:10px 0}.card{background:#101a26;border:1px solid #1e344d;border-radius:12px;padding:12px;margin:8px 0}.BUY{color:#00ff88}.SELL{color:#ff4d4d}.live{color:#00ff88;animation:bl 1s infinite} @keyframes bl{50%{opacity:.3}}.b{font-size:22px;font-weight:700}.s{font-size:11px;color:#6a8aaa}</style></head>
<body><div class="h">⚡ RAPID CENTS SCALPER <span class="live">● LIVE</span> <span id="tm" class="s"></span></div>
<div id="open"></div><div id="stats" class="card"></div><div class="h">Closed (cents)</div><div id="closed"></div>
<script>
async function load(){
 document.getElementById('tm').innerText=new Date().toLocaleTimeString();
 let total$=0,count=0;
 try{
  let j=await fetch('open_signals.json?v='+Date.now()).then(r=>r.json());
  let h='';
  for(let s in j){ for(let t of j[s]||[]){
   if(!t.entry_price) continue;
   let cur=t.current_price, e=t.entry_price;
   let pip=s=='XAUUSD'?0.1:s=='USDJPY'?0.01:0.0001;
   let pips=t.direction=='BUY'?(cur-e)/pip:(e-cur)/pip;
   let usd=pips*0.01; total$+=usd; count++;
   h+=`<div class="card"><b>${s}</b> <span class="${t.direction}">${t.direction}</span> <span class="b" style="color:${pips>=0?'#00ff88':'#ff4d4d'}">${pips>=0?'+':''}${pips.toFixed(2)}p $${usd.toFixed(4)}</span><br><span class="s">${e.toFixed(5)} → ${cur.toFixed(5)}</span></div>`;
  }}
  document.getElementById('open').innerHTML=h||'<div class="card s">No open - opening on next candle (60s)</div>';
  document.getElementById('stats').innerHTML=`Open: ${count} | Live P/L: <b style="color:${total$>=0?'#00ff88':'#ff4d4d'}">$${total$.toFixed(4)}</b> | Mode: GREEN=BUY RED=SELL 0.3p=close`;
 }catch(e){ document.getElementById('open').innerHTML='<div class="card s">Waiting scan... '+e+'</div>'; }

 try{
  let txt=await fetch('closed_trades.csv?v='+Date.now()).then(r=>r.text());
  if(txt.includes('<!DOCTYPE')||txt.includes('<html')) throw 'no csv';
  let rows=txt.trim().split('\n').slice(-20).reverse(); let h='';
  for(let r of rows){ if(r.includes('symbol')||!r.includes(',')) continue; let c=r.split(','); if(c.length<6) continue; let win=c[5]=='WIN'; h+=`<div class="card"><b>${c[1]}</b> ${c[2]} <span style="color:${win?'#00ff88':'#ff4d4d'}">${c[5]} ${c[6]}p</span> <span class="s">${c[0].slice(11,16)}</span></div>`; }
  document.getElementById('closed').innerHTML=h||'<div class="card s">No closed yet - first cents in 1-2 min</div>';
 }catch(e){ document.getElementById('closed').innerHTML='<div class="card s">Waiting first close...</div>'; }
}
load(); setInterval(load,3000);
</script></body></html>
