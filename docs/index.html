<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIVE $10</title><style>body{background:#000;color:#0f0;font-family:monospace;padding:8px}.c{background:#111;padding:10px;margin:6px 0;border-radius:8px;border-left:3px solid #0f0}.s{color:#f44}.b{color:#0f0} h2{color:#fff}</style></head>
<body><h2>LIVE $10 BOT</h2><div id="o">loading...</div><div id="t" style="color:#888"></div><h3 style="color:#fff">Closed</h3><div id="cl"></div>
<script>
async function L(){
 const d=Date.now();
 try{
  let r=await fetch('open_signals.json?'+d); let j=await r.json(); let h=''; let tot=0;
  for(let s in j){ for(let x of j[s]){ let cur=x.current_price; let e=x.entry_price; let pip = s=='XAUUSD'?0.1:s=='USDJPY'?0.01:0.0001; let p = x.direction=='BUY'?(cur-e)/pip:(e-cur)/pip; let usd=p*0.01; tot+=usd; h+=`<div class=c><b>${s}</b> <span class=${x.direction=='BUY'?'b':'s'}>${x.direction}</span> ${p.toFixed(2)}p $${usd.toFixed(4)}<br>${e.toFixed(5)} -> ${cur.toFixed(5)}</div>`; } }
  document.getElementById('o').innerHTML=h||'NO OPEN - next scan in 2min'; document.getElementById('t').innerHTML='Total $'+tot.toFixed(4)+' | '+new Date().toLocaleTimeString();
 }catch(e){ document.getElementById('o').innerHTML='waiting scan...'; }
 try{ let r=await fetch('closed_trades.csv?'+d); let t=await r.text(); let rows=t.trim().split('\n').slice(-15).reverse(); let h=''; for(let row of rows){ if(row.includes('symbol'))continue; let c=row.split(','); h+=`<div class=c>${c[1]} ${c[2]} <b style="color:${c[5]=='WIN'?'#0f0':'#f44'}">${c[5]} ${c[6]}p</b></div>`;} document.getElementById('cl').innerHTML=h; }catch(e){}
}
L(); setInterval(L,5000);
</script></body></html>
