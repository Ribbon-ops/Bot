<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>$100 London Bot</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:10px}
.card{background:#1e293b;border-radius:12px;padding:12px;margin:10px 0}
.win{color:#22c55e}.loss{color:#ef4444}
.badge{padding:2px 8px;border-radius:6px;font-size:12px}
.badge-buy{background:#22c55e;color:#000}.badge-sell{background:#ef4444}
table{width:100%;font-size:13px;border-collapse:collapse}
th{color:#94a3b8;text-align:left;padding:6px}
td{padding:6px;border-top:1px solid #334155}
</style></head>
<body>
<h2>💷 $100 London Breakout - LIVE</h2>
<div id="stats" class="card"></div>
<h3>📈 Open Trades (LIVE)</h3>
<div id="open"></div>
<h3>📊 Closed Today</h3>
<div id="closed"></div>
<script>
async function load(){
 let open = {};
 try{ open = await (await fetch('open_signals.json?t='+Date.now())).json(); }catch(e){}
 let closedText = '';
 try{ closedText = await (await fetch('closed_trades.csv?t='+Date.now())).text(); }catch(e){}

 // OPEN
 let htmlOpen = '';
 let totalFloat = 0;
 for(let sym in open){
   (open[sym]||[]).forEach(tr=>{
     let pnl = tr.current_usd||0;
     totalFloat+=pnl;
     htmlOpen+=`<div class="card">
     <b>${sym}</b> <span class="badge badge-${tr.direction.toLowerCase()}">${tr.direction} ${tr.lot} LOT</span><br>
     Entry: ${tr.entry_price} -> Now: ${tr.current_price}<br>
     TP: ${tr.take_profit} (+$${tr.tp_usd} / ${tr.tp_pips}p) | SL: ${tr.stop_loss} (-$${tr.sl_usd})<br>
     Floating: <b class="${pnl>=0?'win':'loss'}">${tr.current_pips}p / $${pnl}</b><br>
     Asian H: ${tr.asian_high} L: ${tr.asian_low}
     </div>`;
   });
 }
 document.getElementById('open').innerHTML = htmlOpen||'<div class="card">No open trades - waiting for London breakout (10am-7pm Dar)</div>';

 // CLOSED
 if(closedText){
   let rows = closedText.trim().split('\n').slice(1).reverse().slice(0,20);
   let total=0, wins=0;
   let table='<table><tr><th>Time</th><th>Pair</th><th>Dir</th><th>Lot</th><th>Pips</th><th>USD</th></tr>';
   rows.forEach(r=>{
     let c=r.split(',');
     if(c.length<6) return;
     let usd=parseFloat(c[8]||0);
     if(r.includes(new Date().toISOString().slice(0,10))){ total+=usd; if(usd>0) wins++; }
     table+=`<tr><td>${(c[0]||'').slice(11,16)}</td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td class="${c[6]=='WIN'?'win':'loss'}">${c[7]}p</td><td class="${usd>=0?'win':'loss'}">$${c[8]}</td></tr>`;
   });
   table+='</table>';
   document.getElementById('closed').innerHTML=`<div class="card">Today P&L: <b class="${total>=0?'win':'loss'}">$${total.toFixed(2)}</b> | Wins today: ${wins}</div>`+table;
 }
 document.getElementById('stats').innerHTML=`Balance: $100 Standard | Lot: 0.01 | TP: 8p = $0.80 | SL: 4p = $0.40 | Floating: $${totalFloat.toFixed(2)} | Time: ${new Date().toLocaleString('en-TZ',{timeZone:'Africa/Dar_es_Salaam'})}`;
}
load(); setInterval(load,30000);
</script>
</body>
</html>
